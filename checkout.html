<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>MyPerfume - Checkout</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/checkout.css">

</head>


<body>

    <!-- ================================
         NAVBAR
    ================================= -->

    <header class="navbar">

        <div class="logo">
            ✦ MyPerfume
        </div>

        <nav>

            <a href="home.html">
                Home
            </a>

            <a href="products.html">
                Shop
            </a>

            <a href="customize.html">
                Customize
            </a>

            <a href="wishlist.html">
                Wishlist
            </a>

            <a href="cart.html">
                🛒
                <span id="cartCount">0</span>
            </a>

            <a href="profile.html">
                Profile
            </a>

            <button id="logoutBtn">
                Logout
            </button>

        </nav>

    </header>


    <!-- ================================
         CHECKOUT
    ================================= -->

    <main class="checkout-page">

        <div class="checkout-header">

            <p>MY PERFUME</p>

            <h1>Checkout</h1>

            <span>
                Complete your order details.
            </span>

        </div>


        <div class="checkout-container">


            <!-- =========================
                 DELIVERY DETAILS
            ========================== -->

            <section class="checkout-card">

                <h2>
                    Delivery Details
                </h2>


                <div class="checkout-form">


                    <div class="form-group">

                        <label>
                            Full Name
                        </label>

                        <input
                            type="text"
                            id="checkoutName"
                            placeholder="Enter your name"
                        >

                    </div>


                    <div class="form-group">

                        <label>
                            Phone Number
                        </label>

                        <input
                            type="tel"
                            id="checkoutPhone"
                            placeholder="Enter phone number"
                        >

                    </div>


                    <div class="form-group">

                        <label>
                            Country
                        </label>

                        <input
                            type="text"
                            id="checkoutCountry"
                            placeholder="Enter country"
                        >

                    </div>


                    <div class="form-group">

                        <label>
                            Address
                        </label>

                        <textarea
                            id="checkoutAddress"
                            placeholder="Enter delivery address"
                        ></textarea>

                    </div>


                    <div class="form-row">

                        <div class="form-group">

                            <label>
                                City
                            </label>

                            <input
                                type="text"
                                id="checkoutCity"
                                placeholder="City"
                            >

                        </div>


                        <div class="form-group">

                            <label>
                                State
                            </label>

                            <input
                                type="text"
                                id="checkoutState"
                                placeholder="State"
                            >

                        </div>


                        <div class="form-group">

                            <label>
                                PIN Code
                            </label>

                            <input
                                type="text"
                                id="checkoutPin"
                                placeholder="PIN"
                            >

                        </div>

                    </div>

                </div>

            </section>


            <!-- =========================
                 ORDER SUMMARY
            ========================== -->

            <section class="order-card">

                <h2>
                    Order Summary
                </h2>


                <div id="orderItems"
                     class="order-items">
                </div>


                <div class="order-total">

                    <span>
                        Total
                    </span>

                    <strong id="checkoutTotal">
                        ₹0
                    </strong>

                </div>


                <button
                    id="placeOrderBtn"
                    class="place-order-btn">

                    Place Order

                </button>


                <a
                    href="cart.html"
                    class="back-cart">

                    ← Back to Cart

                </a>

            </section>

        </div>

    </main>


    <footer>

        © 2026 MyPerfume. All rights reserved.

    </footer>


    <script src="js/checkout.js"></script>

</body>

</html>
