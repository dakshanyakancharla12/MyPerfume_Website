<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>MyPerfume - Order Confirmed</title>

    <link rel="stylesheet" href="css/style.css">

        <nav>

            <a href="customize.html">

            </a>

            <a href="wishlist.html">

            </a>

            <a href="cart.html">
