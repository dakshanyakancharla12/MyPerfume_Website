<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>MyPerfume | Sign Up</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/auth.css">

</head>

<body>

    <div class="auth-container">

        <!-- Left Side -->
        <div class="auth-image">

            <div class="brand-content">

            </div>

        </div>


        <!-- Right Side -->
        <div class="auth-form">

            <div class="form-content">

                <h2>Create Account</h2>

                <p class="subtitle">
                    Start creating your perfect fragrance.
                </p>


                <form id="signupForm">

                    <!-- Name -->
                    <div class="input-group">

                        <label for="signupName">
                            Full Name
                        </label>

                        <input
                            type="text"
                            id="signupName"
                            placeholder="Enter your name"
                            required
                        >

                    </div>


                    <!-- Email -->
                    <div class="input-group">

                        <label for="signupEmail">
                            Email Address
                        </label>

                        <input
                            type="email"
                            id="signupEmail"
                            placeholder="Enter your email"
                            required
                        >

                    </div>


                    <!-- Password -->
                    <div class="input-group">

                        <label for="signupPassword">
                            Password
                        </label>

                        <input
                            type="password"
                            id="signupPassword"
                            placeholder="Create a password"
                            required
                        >

                    </div>


                    <!-- Confirm Password -->
                    <div class="input-group">

                        <label for="confirmPassword">
                            Confirm Password
                        </label>

                        <input
                            type="password"
                            id="confirmPassword"
                            placeholder="Confirm your password"
                            required
                        >

                    </div>


                    <!-- Message -->
                    <p id="signupMessage"></p>


                    <!-- Button -->
                    <button
                        type="submit"
                        class="auth-btn"
                    >
                        Create Account
                    </button>

                </form>


                <!-- Login -->
                <p class="switch-page">

                    Already have an account?

                    <a href="index.html">
                        Login
                    </a>

                </p>

            </div>

        </div>

    </div>


    <script src="js/signup.js"></script>

</body>

</html>
